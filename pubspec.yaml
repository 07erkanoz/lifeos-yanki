name: lifeos_yanki
description: "LifeOS Yankı — LifeOS'un sesli ajanı (Linux)"
publish_to: 'none'

version: 0.1.4+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.4
  crypto: ^3.0.6
  dbus: ^0.7.15
  ffi: ^2.1.4
  flutter_recorder: ^2.0.5
  flutter_soloud: ^5.1.5
  flutter_webrtc: ^1.6.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  sherpa_onnx: ^1.13.8
  window_manager: ^0.5.1
  xml: ^7.0.1
  tray_manager: ^0.8.3

hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ses/okuma.json
    - assets/ses/silero_vad.onnx
    - assets/branding/
  shaders:
    - shaders/yanki_nebula.frag
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/ui/Inter-Regular.ttf
        - asset: fonts/ui/Inter-Medium.ttf
          weight: 500
        - asset: fonts/ui/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/ui/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: fonts/mono/JetBrainsMono-Regular.ttf
        - asset: fonts/mono/JetBrainsMono-Medium.ttf
          weight: 500
